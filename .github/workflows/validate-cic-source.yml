name: Validate CIC source

on:
  push:
    branches: [master]
    paths:
      - 'apps/studio/scripts/import-cic/data/**'
      - 'apps/studio/scripts/import-cic/validate-source.ts'
      - 'apps/studio/scripts/import-cic/portableText.ts'
      - 'apps/studio/scripts/import-cic/types.ts'
      - '.github/workflows/validate-cic-source.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate final static CIC source offline
        run: npx --yes tsx@4.20.5 apps/studio/scripts/import-cic/validate-source.ts
