name: Validate CIC source

on:
  push:
    branches: [master]
    paths:
      - 'apps/studio/scripts/import-cic/data/**'
      - 'apps/studio/scripts/import-cic/validate-source.ts'
      - 'apps/studio/scripts/import-cic/canonSource.ts'
      - 'apps/studio/scripts/import-cic/portableText.ts'
      - 'apps/studio/scripts/import-cic/types.ts'
      - 'apps/studio/package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-cic-source.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate CIC source without network acquisition
        run: npm run cic:validate -w apps/studio
